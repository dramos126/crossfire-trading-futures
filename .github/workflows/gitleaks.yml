# Scans every push and pull request for committed secrets. Fails the check on a hit.
name: gitleaks
on:
  push:
  pull_request:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The same release the export runs; the action's own default lags.
          GITLEAKS_VERSION: 8.30.1
